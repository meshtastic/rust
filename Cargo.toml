[package]
name = "meshtastic"
description = "A Rust library for communicating with and configuring Meshtastic devices."
homepage = "https://meshtastic.org/"
repository = "https://github.com/meshtastic/rust"
documentation = "https://docs.rs/meshtastic"
keywords = ["meshtastic", "mesh", "lora", "tcp", "serial"]
categories = ["embedded", "config", "encoding"]
authors = ["Adam McQuilkin"]
readme = "README.md"
license = "GPL-3.0"
version = "0.1.9"
rust-version = "1.89"
edition = "2021"
resolver = "3"

[lib]
doctest = false

[features]
default = ["serde", "tokio", "strum"]
gen = ["dep:prost-build", "dep:protoc-bin-vendored", "dep:walkdir"]

serde = ["dep:serde", "dep:serde_json"]
ts-gen = ["serde", "dep:specta", "dep:specta-typescript"]
bluetooth-le = ["dep:uuid", "dep:btleplug", "dep:futures"]
tokio = ["dep:tokio", "dep:tokio-serial", "dep:tokio-util", "dep:bytes"]
strum = ["dep:strum"]

[lints.rust]
missing_docs = "warn"

[lints.clippy]
large_enum_variant = "allow"

[[example]]
name = "basic_serial"
required-features = ["tokio"]

[[example]]
name = "basic_tcp"
required-features = ["tokio"]

[[example]]
name = "message_filtering"
required-features = ["tokio"]

[[example]]
name = "generate_typescript_types"
required-features = ["ts-gen", "tokio"]

[[example]]
name = "basic_ble"
required-features = ["bluetooth-le", "tokio"]

[build-dependencies]
prost-build = { version = "0.14.6", optional = true }
protoc-bin-vendored = { version = "3.3.0", optional = true }
walkdir = { version = "2.5.1", optional = true }

[dependencies]
futures-util = "0.3.31"
rand = "0.10.4"
tokio = { version = "1.54.1", features = ["full"], optional = true }
tokio-serial = { version = "5.5.0", optional = true }
tokio-util = { version = "0.7.20", optional = true, features = ["codec", "rt"] }
bytes = { version = "1", optional = true }
prost = "0.14.6"
log = "0.4.35"

specta = { git = "https://github.com/specta-rs/specta.git", rev = "b596ef0", optional = true, features = [
    "derive",
    "export",
    "chrono",
], version = "=2.0.0-rc.22" }
specta-typescript = { git = "https://github.com/specta-rs/specta.git", rev = "b596ef0", optional = true, version = "=0.0.9" }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
thiserror = "2.0.21"
uuid = { version = "1.29.3", optional = true }
btleplug = { version = "0.13.5", optional = true, features = ["serde"] }
futures = { version = "0.3.34", optional = true }
strum = { version = "0.28", optional = true, features = ["derive"] }

[dev-dependencies]
fern = { version = "0.7.1", features = ["colored"] }
humantime = "2.4.0"

[package.metadata.docs.rs]
features = ["bluetooth-le"]
rustdoc-args = ["--cfg", "docsrs"]
